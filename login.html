<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Staff Login | Battle Born Promotions</title>

  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">
        <img
          src="images/logo.jpeg"
          alt="Battle Born Promotions"
          class="logo"
        >

        <p class="staff-label">STAFF ACCESS</p>
      </div>

      <div class="login-heading">
        <h1>Welcome Back</h1>
        <p>Sign in to manage customer promotions.</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div
          id="loginMessage"
          class="login-message"
          role="alert"
        ></div>

        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          SIGN IN
        </button>

      </form>

      <p class="security-note">
        Authorized staff only
      </p>

    </section>

  </main>

  <script src="js/login.js"></script>

</body>
</html>
